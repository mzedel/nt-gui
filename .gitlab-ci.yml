variables:
  DEFAULT_BRANCH: 'main'
  GITHUB_REPO_URL:
    description: "The Github Repo URL for release-please, in the format of 'owner/repo'"
    value: 'NorthernTechHQ/nt-gui'
  GITHUB_USER_NAME:
    description: 'The Github username for release-please'
    value: 'mender-test-bot'
  GITHUB_USER_EMAIL:
    description: 'The Github user email for release-please'
    value: 'mender@northern.tech'
  GIT_CLIFF:
    description: 'Run git cliff to override the release-please changelog'
    value: 'true'
    options:
      - 'true'
      - 'false'
  NODE_IMAGE:
    value: 'node:24'
    description: 'Node version to use for building and testing'
  GITHUB_STATUS_API_URL:
    value: 'https://api.github.com/repos/NorthernTechHQ/$CI_PROJECT_NAME/statuses/$CI_COMMIT_SHA'
    description: 'Github endpoint to update CI pipeline progress'
  NPM_CONFIG_CACHE: '$CI_PROJECT_DIR/.npm'
  HUSKY:
    value: "0"
    description: 'Disable pre-commit hooks in CI'

stages:
  - test
  - build
  - changelog
  - release

workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  tags: !reference [.qa-common-default-runner, tags]
  retry: !reference [.qa-common-default-retry, retry]
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/${NODE_IMAGE}

include:
  - component: 'gitlab.com/Northern.tech/Mender/mendertesting/commit-lint@master'
  - project: 'Northern.tech/Mender/mendertesting'
    file:
      - '.gitlab-ci-github-status-updates.yml'
      - qa-common/runner.yml
      - qa-common/retry.yml

lint:
  stage: test
  needs:
    - job: build
      artifacts: true
  script:
    - npm run lint

format:
  stage: test
  needs:
    - job: build
      artifacts: true
  script:
    - npm run format:check

typecheck:
  stage: test
  needs:
    - job: build
      artifacts: true
  tags:
    - k8s
  script:
    - npm run typecheck

test:
  stage: test
  needs:
    - job: build
      artifacts: true
  tags:
    - k8s
  script:
    - npm run test

build:
  stage: test
  tags:
    - k8s
  script:
    - npm ci
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - .turbo/cache
      - node_modules
      - packages/*/node_modules

changelog:
  stage: changelog
  image: 'registry.gitlab.com/northern.tech/mender/mender-test-containers/release-please:master'
  resource_group: changelog-${CI_COMMIT_REF_NAME}
  interruptible: true
  variables:
    GIT_DEPTH: 0 # Always get the full history
    GIT_STRATEGY: clone
    GIT_CLIFF_VERSION: '2.14.2'
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^Merge pull request #\d+ from NorthernTechHQ\/release-please--branches--/'
      when: never
    - if: $CI_COMMIT_BRANCH =~ "/^\d+\.\d+\.x$/"
    - if: $CI_COMMIT_BRANCH == $DEFAULT_BRANCH
  before_script:
    # Setting up git
    - git config --global user.email "${GITHUB_USER_EMAIL}"
    - git config --global user.name "${GITHUB_USER_NAME}"
    # GITHUB_TOKEN for Github cli authentication
    - export GITHUB_TOKEN=${GITHUB_CLI_TOKEN}
    - npm install -g git-cliff@${GIT_CLIFF_VERSION}
    - wget --output-document /tmp/cliff.toml https://raw.githubusercontent.com/mendersoftware/mendertesting/master/utils/cliff.toml.scoped
  script:
    - release-please release-pr
      --token=${GITHUB_BOT_TOKEN_REPO_FULL}
      --repo-url=${GITHUB_REPO_URL}
      --target-branch=${CI_COMMIT_REF_NAME}
      --config-file=release-please-config.json
      --manifest-file=.release-please-manifest.json
    # git cliff: override the changelog
    - test $GIT_CLIFF == "false" && echo "INFO - Skipping git-cliff" && exit 0
    - git remote add github-${CI_JOB_ID} https://${GITHUB_USER_NAME}:${GITHUB_BOT_TOKEN_REPO_FULL}@github.com/${GITHUB_REPO_URL} || true # Ignore already existing remote
    - gh repo set-default https://${GITHUB_USER_NAME}:${GITHUB_BOT_TOKEN_REPO_FULL}@github.com/${GITHUB_REPO_URL}
    # look up all release PRs at once instead of once per component
    - RELEASE_PLEASE_PRS=$(gh pr list --author "${GITHUB_USER_NAME}" --state open --limit 100 --json number,headRefName)
    - test "$(echo "${RELEASE_PLEASE_PRS}" | jq 'length')" == "0" && echo "INFO - no release PRs found" && exit 0
    # each git-cliff run pages through the full commit & pull request history -> store it & use it as cliff context instead
    - |
      git cliff --config /tmp/cliff.toml --github-repo ${GITHUB_REPO_URL} --context -o /tmp/cliff-context.json || {
        echo "WARN - could not collect remote data, changelogs will be generated without commit authors";
        echo '[]' > /tmp/cliff-context.json;
      }
    - |
      jq '[.[].commits[] | select(.remote) | {key: .id, value: .remote}] | from_entries' /tmp/cliff-context.json > /tmp/cliff-remote.json
    # deal with the component's changelogs
    - |
      cliff_render() {
        local output="$1"; shift;
        git cliff --offline --config /tmp/cliff.toml --github-repo ${GITHUB_REPO_URL} "$@" --context -o /tmp/cliff-component.json;
        jq --slurpfile remote /tmp/cliff-remote.json 'map(.commits |= map(.remote = $remote[0][.id]))' /tmp/cliff-component.json > /tmp/cliff-component-remote.json;
        git cliff --offline --config /tmp/cliff.toml --github-repo ${GITHUB_REPO_URL} --from-context /tmp/cliff-component-remote.json -o "$output";
      }
      for component in $(jq -r 'keys[] | select(. != ".")' .release-please-manifest.json); do
        component_name=$(echo "$component" | cut -d'/' -f2);
        # Use exact branch name match for the specific component's release PR
        RELEASE_PLEASE_PR=$(echo "${RELEASE_PLEASE_PRS}" | jq -r --arg head "release-please--branches--${CI_COMMIT_REF_NAME}--components--@northern.tech/${component_name}" '.[] | select(.headRefName == $head) | .number');
        if [[ -z "$RELEASE_PLEASE_PR" ]]; then
          echo "INFO - no PR found for @northern.tech/$component_name";
          continue;
        fi
        gh pr checkout --force $RELEASE_PLEASE_PR;
        COMPONENT_VERSION=$(jq -r ".\"${component}\"" .release-please-manifest.json);
        cd $component;
          echo "INFO - generating git cliff for $component_name version $COMPONENT_VERSION"
          cliff_render ./CHANGELOG.md --tag ${COMPONENT_VERSION} --repository "../../" --include-path "${component}/**/*" --tag-pattern "@northern.tech/${component_name}-.*";
          cat CHANGELOG.md;
          if git diff --quiet CHANGELOG.md; then
            echo "INFO - no CHANGELOG changes for @northern.tech/$component_name, skipping";
            cd ../..;
            continue;
          fi
          git add CHANGELOG.md;
          git commit --amend -s --no-edit;
          git push github-${CI_JOB_ID} --force;
          cliff_render tmp_pr_body.md --unreleased --tag ${COMPONENT_VERSION} --repository "../../" --include-path "${component}/**/*" --tag-pattern "@northern.tech/${component_name}-.*";
          gh pr edit $RELEASE_PLEASE_PR --body-file tmp_pr_body.md;
          rm tmp_pr_body.md;
        cd ../..;
      done
  after_script:
    - git remote remove github-${CI_JOB_ID}

release:
  stage: release
  image: 'registry.gitlab.com/northern.tech/mender/mender-test-containers/release-please:master'
  rules:
    - if: $CI_COMMIT_BRANCH == $DEFAULT_BRANCH
  needs:
    - job: changelog
      optional: true
    - job: build
      artifacts: true
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  before_script:
    - apt-get update && apt-get install -y jq
  script:
    - npm ci # the release image differs from the rest, so we need to reinstall here
    - npm run build
    - release-please github-release
      --token=${GITHUB_BOT_TOKEN_REPO_FULL}
      --repo-url=${GITHUB_REPO_URL}
      --target-branch=${CI_COMMIT_REF_NAME}
      --config-file=release-please-config.json
      --manifest-file=.release-please-manifest.json
    - |
      # keep publishing the remaining packages if one fails, but fail the job afterwards
      FAILED_PACKAGES="";
      for component in $(jq -r 'keys[] | select(. != ".")' .release-please-manifest.json); do
        cd $component;
        PKG_NAME=$(jq -r '.name' package.json);
        PKG_VERSION=$(jq -r '.version' package.json);
        if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
          echo "INFO - ${PKG_NAME}@${PKG_VERSION} already published, skipping";
        else
          echo "INFO - publishing ${PKG_NAME}@${PKG_VERSION}";
          npm publish --provenance=false --loglevel verbose || {
            echo "ERROR - publishing ${PKG_NAME}@${PKG_VERSION} failed";
            FAILED_PACKAGES="${FAILED_PACKAGES} ${PKG_NAME}@${PKG_VERSION}";
          };
        fi
        cd ../..;
      done
      if [[ -n "$FAILED_PACKAGES" ]]; then
        echo "ERROR - failed to publish:${FAILED_PACKAGES}";
        exit 1;
      fi

pages:
  stage: release
  rules:
    # main is published by pages:main, which would otherwise report the same status twice
    - if: $CI_COMMIT_BRANCH != $DEFAULT_BRANCH
  needs:
    - job: build
      artifacts: true
  variables:
    GITHUB_STATUS_API_JSON_F: '{"state": "%s", "context": "ci/storybook", "target_url": "%s", "description": "%s"}'
    PAGES_PREFIX: ''
  script:
    - npm run build
    - npm run build-storybook
    - json="$(printf "$GITHUB_STATUS_API_JSON_F" "success" "${CI_PAGES_URL}" "Storybook deployed")"
    - curl -f -H "$GITHUB_AUTH" -d "$json" "$GITHUB_STATUS_API_URL"
  pages:
    path_prefix: '$CI_COMMIT_BRANCH'
    expire_in: 2 weeks
  publish: storybook-static
  artifacts:
    paths:
      - storybook-static

pages:main:
  extends: pages
  rules:
    - if: $CI_COMMIT_BRANCH == $DEFAULT_BRANCH
  pages:
    path_prefix: ''
    expire_in: never
